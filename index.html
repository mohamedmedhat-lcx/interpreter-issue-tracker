<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpreter Issue Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="logo">Languages<span class="logo-cx">CX</span></div>
                <div class="tagline">Interpreter Issue Tracking System</div>
            </div>
        </div>
        
        <div class="content">
        <h1>Interpreter Issue Tracker</h1>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="report">Report Issue</button>
            <button class="tab-btn" data-tab="view">View Issues</button>
        </div>
        
        <div id="supervisor-login" style="margin-bottom: 20px;">
            <button id="supervisor-mode-btn" class="btn-secondary">Supervisor Mode</button>
            <span id="issue-count" style="margin-left: 20px; color: #666; font-weight: bold;">0 issue(s) reported</span>
        </div>

        <div id="report-tab" class="tab-content active">
            <form id="issue-form">
                <div class="form-group">
                    <label for="issue-type">Issue Type:</label>
                    <select id="issue-type" required>
                        <option value="">Select type...</option>
                        <option value="missed-call">Missed Call</option>
                        <option value="account-issue">Account Issue</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="interpreter-name">Interpreter Name:</label>
                    <select id="interpreter-name" required>
                        <option value="">Select interpreter...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="interpreter-id">Interpreter ID:</label>
                    <input type="text" id="interpreter-id" readonly>
                </div>

                <div class="form-group">
                    <label for="interpreter-language">Language:</label>
                    <input type="text" id="interpreter-language" readonly>
                </div>

                <div id="missed-call-fields" class="conditional-fields" style="display: none;">
                    <div class="form-group">
                        <label for="call-id">Call ID:</label>
                        <input type="text" id="call-id">
                    </div>
                    <div class="form-group">
                        <label for="reason">Reason:</label>
                        <textarea id="reason" rows="3"></textarea>
                    </div>
                </div>

                <div id="account-issue-fields" class="conditional-fields" style="display: none;">
                    <div class="form-group">
                        <label for="account-status">Account Status:</label>
                        <select id="account-status">
                            <option value="">Select status...</option>
                            <option value="dialling">Dialling</option>
                            <option value="busy">Busy</option>
                            <option value="forced-unavailable">Forced Unavailable</option>
                            <option value="locked">Locked Account</option>
                            <option value="other">Other (Please elaborate below)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="missed-calls-count">Missed Calls Count:</label>
                        <input type="number" id="missed-calls-count" min="0" max="10">
                    </div>
                    <div class="form-group">
                        <label for="account-notes">Notes:</label>
                        <textarea id="account-notes" rows="3" placeholder="Describe the issue in detail..."></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label for="start-date">Issue Start Date & Time (PST):</label>
                    <input type="datetime-local" id="start-date" required>
                </div>

                <div class="form-group">
                    <label for="attachment-url">Attachment URL (optional):</label>
                    <input type="url" id="attachment-url" placeholder="https://drive.google.com/... or screenshot link">
                    <small style="color: #666; display: block; margin-top: 5px;">Upload your file to Google Drive/Dropbox and paste the link here</small>
                </div>

                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" required disabled>
                        <option value="open">Open</option>
                        <option value="pending-interpreter" style="display: none;">Pending Interpreter Validation</option>
                        <option value="waiting-client" style="display: none;">Waiting Client Response</option>
                        <option value="pending-it" style="display: none;">Pending IT Review</option>
                        <option value="in-progress" style="display: none;">In Progress</option>
                        <option value="resolved" style="display: none;">Resolved</option>
                    </select>
                </div>

                <div class="form-group" id="resolution-date-group" style="display: none;">
                    <label for="resolution-date">Resolution Date & Time (PST):</label>
                    <input type="datetime-local" id="resolution-date">
                </div>

                <button type="submit" class="btn-primary">Submit Issue</button>
            </form>
        </div>

        <div id="view-tab" class="tab-content">
            <div class="filters">
                <input type="date" id="filter-date" placeholder="Filter by date">
                <input type="text" id="search" placeholder="Search by name or call ID...">
                <select id="filter-type">
                    <option value="">All Types</option>
                    <option value="missed-call">Missed Calls</option>
                    <option value="account-issue">Account Issues</option>
                </select>
                <select id="filter-status">
                    <option value="">All Statuses</option>
                    <option value="open">Open</option>
                    <option value="pending-interpreter">Pending Interpreter Validation</option>
                    <option value="waiting-client">Waiting Client Response</option>
                    <option value="pending-it">Pending IT Review</option>
                    <option value="in-progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                </select>
                <button id="export-btn" class="btn-secondary">Export CSV</button>
            </div>

            <div id="issues-list"></div>
        </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
